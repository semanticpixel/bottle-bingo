<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bottle Bingo</title>
    <link rel="stylesheet" href="src/css/app.css">
  </head>
  <body>
    <main>
      <header>
        <h1>🍸 Bottle Bingo</h1>
        <p class="subtitle">Spot the bottles, get a bingo!</p>
      </header>

      <!-- Game Screen -->
      <div class="game-screen" id="gameScreen">
        <div class="game-header">
          <div class="game-info">
            <div class="bingo-status hidden" id="bingoStatus">🎉 BINGO! 🎉</div>
            <div class="board-limit-info" id="boardLimitInfo">
              New boards today: 0/3
            </div>
          </div>
          <div class="game-actions">
            <button class="btn btn-small btn-secondary" id="shuffleBtn">
              Shuffle
            </button>
            <button class="btn btn-small btn-primary" id="newBoardBtn">
              New Board
            </button>
            <button class="btn btn-small btn-secondary" id="startGameBtn">
              Start Game
            </button>
            <button class="btn btn-small btn-warning hidden" id="endGameBtn">
              End Game
            </button>
          </div>
        </div>

        <div class="difficulty-toggle" id="difficultyToggle" role="group" aria-label="Difficulty">
          <button class="diff-seg" type="button" data-difficulty="one-night">One Night</button>
          <button class="diff-seg" type="button" data-difficulty="one-weekend">One Weekend</button>
          <button class="diff-seg" type="button" data-difficulty="one-week">One Week</button>
          <button class="diff-seg" type="button" data-difficulty="new-york">New York</button>
        </div>

        <div class="location-bar" id="locationBar">
          <button class="loc-toggle" type="button" id="locationToggleBtn" aria-pressed="false">
            📍 Bar-hop: Off
          </button>
          <span class="location-status hidden" id="locationStatus"></span>
          <button class="btn btn-small btn-secondary hidden" id="newBarBtn">New bar</button>
        </div>
        <p class="location-msg hidden" id="locationMsg" role="status" aria-live="polite"></p>

        <div class="bingo-grid" id="bingoGrid"></div>
      </div>

      <!-- Overlay -->
      <div class="overlay" id="overlay">
        <div class="overlay-content">
          <button class="overlay-close" id="overlayClose">×</button>
          <img class="overlay-image" id="overlayImage" src="" alt="" />
          <h2 class="overlay-title" id="overlayTitle"></h2>
          <p class="overlay-cap-note hidden" id="overlayCapNote">
            You've hit this bar's limit — check in at a new bar to mark more.
          </p>
          <div class="overlay-actions">
            <button class="btn btn-secondary" id="overlayToggleBtn">
              Mark Found
            </button>
          </div>
        </div>
      </div>

      <!-- Bingo Modal -->
      <div class="overlay" id="bingoModal">
        <div class="overlay-content">
          <h2 class="overlay-title">🎉 BINGO! 🎉</h2>
          <p style="text-align: center; margin: 1rem 0">
            Congratulations! You got a bingo!
          </p>
          <div class="overlay-actions">
            <button class="btn btn-primary" id="newGameBtn">New Game</button>
          </div>
        </div>
      </div>
    </main>

    <script src="src/js/main.js"></script>
  </body>
</html>
